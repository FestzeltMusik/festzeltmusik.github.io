name: Liste aktualisieren

on:
  schedule:
    - cron: "17 4 * * *"   # jeden Tag ca. 5–6 Uhr deutscher Zeit
  workflow_dispatch:        # von Hand starten: Actions → Liste aktualisieren → Run workflow
  push:
    paths:
      - ".github/**"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -U yt-dlp
      - run: python .github/scripts/update_list.py PLJANYFO31lFA
      - name: Änderungen speichern
        run: |
          if [ -n "$(git status --porcelain videos.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add videos.json
            git commit -m "Liste aktualisiert"
            git push
          else
            echo "Keine Änderungen."
          fi
